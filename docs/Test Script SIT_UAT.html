<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test Script SIT/UAT</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1b2333;--mut:#667085;--bd:#dfe3ec;--pri:#0f766e;--pri2:#e0f4f1;--ok:#12805c;--okbg:#e2f5ee;--ng:#b42318;--ngbg:#fdecea;--pd:#8a5a00;--pdbg:#fff1d6;--hd:#eef1f7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141d;--card:#181e2a;--tx:#e8ecf5;--mut:#98a2b8;--bd:#2a3244;--pri:#4fd1c5;--pri2:#123a38;--ok:#4cd3a0;--okbg:#12362b;--ng:#ff8a7a;--ngbg:#3a1e1e;--pd:#f3c15e;--pdbg:#3a2f12;--hd:#1e2535}}
:root[data-theme="dark"]{--bg:#10141d;--card:#181e2a;--tx:#e8ecf5;--mut:#98a2b8;--bd:#2a3244;--pri:#4fd1c5;--pri2:#123a38;--ok:#4cd3a0;--okbg:#12362b;--ng:#ff8a7a;--ngbg:#3a1e1e;--pd:#f3c15e;--pdbg:#3a2f12;--hd:#1e2535}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1250px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
label{display:block;font-size:12px;font-weight:600;margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 9px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:-1px}
textarea{resize:vertical;min-height:38px}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.st{flex:1;min-width:110px;border:1px solid var(--bd);border-radius:10px;padding:8px 12px;background:var(--card)}
.st b{display:block;font-size:20px}.st span{font-size:12px;color:var(--mut)}
.prog{height:8px;background:var(--hd);border-radius:99px;overflow:hidden;margin-bottom:12px;display:flex}
.prog i{display:block;height:100%;transition:width .25s}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.chip{font:inherit;font-size:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:4px 11px;cursor:pointer}
.chip.on{background:var(--pri);border-color:var(--pri);color:var(--bg)}
.mod{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:16px;overflow:hidden}
.mh{padding:10px 14px;background:var(--pri2);color:var(--pri);font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sh{padding:8px 14px;background:var(--hd);font-weight:600;font-size:13px;border-top:1px solid var(--bd)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:1150px}
th{text-align:left;font-size:12px;padding:8px 8px;white-space:nowrap;border-top:1px solid var(--bd);color:var(--mut)}
td{padding:6px 8px;border-top:1px solid var(--bd);vertical-align:top}
td.n{color:var(--mut);width:30px;padding-top:12px}
td input,td select,td textarea{padding:5px 7px;font-size:13px}
.tp{min-width:88px}.tp.Positif{color:var(--ok);font-weight:600}.tp.Negatif{color:var(--ng);font-weight:600}
.rs{min-width:96px;font-weight:600}.rs.OK{background:var(--okbg);color:var(--ok)}.rs.NOK{background:var(--ngbg);color:var(--ng)}.rs.Pending{background:var(--pdbg);color:var(--pd)}
tr.dim td{opacity:.9}
.mini{background:none;border:1px dashed var(--bd);color:var(--pri);border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer;white-space:nowrap}
.mini.has{border-style:solid;background:var(--pri2)}
.x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:16px;padding:4px}
button.b{font:inherit;font-weight:600;border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
button.p{background:var(--pri);border-color:var(--pri);color:var(--bg)}
.add{padding:8px 14px;border-top:1px solid var(--bd)}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none}.toast.on{opacity:1}
</style></head><body><div class="wrap">
<h1>Test Script SIT / UAT</h1>
<section class="card"><div class="grid">
<div><label>Nama Aplikasi</label><input value="ESS HR"></div>
<div><label>Jenis Test</label><select><option>SIT</option><option>UAT</option></select></div>
<div><label>Versi / Release</label><input placeholder="1.0.0"></div>
<div><label>Tanggal Testing</label><input type="date"></div>
<div><label>Environment</label><select><option>Staging</option><option>UAT</option><option>Production</option></select></div>
</div></section>

<div class="stats" id="stats"></div>
<div class="prog" id="prog"></div>
<div class="tools"><span style="font-size:12px;color:var(--mut)">Filter hasil:</span><span id="chips"></span>
<span style="flex:1"></span><button class="b" id="addmod">+ Tambah Modul</button></div>
<div id="mods"></div>
<div class="actions"><button class="b" id="sv">Simpan Draft</button><button class="b p" id="sb">Submit Hasil Testing</button></div>
</div><div class="toast" id="t"></div>
<script>
const seed=[["Dept Head","Positif","Akses link web ESS HR","URL aplikasi ESS HR","Menampilkan halaman login ESS HR","OK","-","Dina"],
["Dept Head","Negatif","Login ke aplikasi ESS HR dengan password yang salah","Username valid + Password salah","Menampilkan pesan error login","OK","-","Dina"],
["Dept Head","Positif","Login ke aplikasi ESS HR dengan password yang benar","Username & Password valid","Menampilkan halaman utama/dashboard ESS HR","OK","-","Dina"]];
const mk=r=>({role:r[0]||"",type:r[1]||"Positif",act:r[2]||"",inp:r[3]||"",out:r[4]||"",res:r[5]||"Pending",note:r[6]||"",tester:r[7]||"",paraf:!!r[5],cap:false});
let M=[{name:"Modul Create PTK",secs:[{name:"Created by Dept. Head",rows:seed.map(mk)}]}];
let flt="";const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
function render(){
$('mods').innerHTML=M.map((m,mi)=>`<div class="mod"><div class="mh"><span>${mi+1}. <input data-k="mn" data-m="${mi}" value="${esc(m.name)}" style="width:280px;font-weight:700"></span><button class="x" data-a="dm" data-m="${mi}" title="Hapus modul">✕</button></div>
${m.secs.map((s,si)=>`<div class="sh">${String.fromCharCode(65+si)}. <input data-k="sn" data-m="${mi}" data-s="${si}" value="${esc(s.name)}" style="width:280px"></div>
<div class="tbl"><table><thead><tr><th>No</th><th>Role</th><th>Type Test</th><th>Activity</th><th>Input</th><th>Expected Output</th><th>Result</th><th>Notes</th><th>Paraf</th><th>Tester</th><th>Capture</th><th></th></tr></thead><tbody>
${s.rows.map((r,ri)=>flt&&r.res!=flt?'':`<tr><td class="n">${ri+1}</td>
<td><input data-k="role" data-m="${mi}" data-s="${si}" data-r="${ri}" value="${esc(r.role)}" style="min-width:90px"></td>
<td><select class="tp ${r.type}" data-k="type" data-m="${mi}" data-s="${si}" data-r="${ri}"><option ${r.type=='Positif'?'selected':''}>Positif</option><option ${r.type=='Negatif'?'selected':''}>Negatif</option></select></td>
<td><textarea data-k="act" data-m="${mi}" data-s="${si}" data-r="${ri}" style="min-width:200px">${esc(r.act)}</textarea></td>
<td><textarea data-k="inp" data-m="${mi}" data-s="${si}" data-r="${ri}" style="min-width:150px">${esc(r.inp)}</textarea></td>
<td><textarea data-k="out" data-m="${mi}" data-s="${si}" data-r="${ri}" style="min-width:200px">${esc(r.out)}</textarea></td>
<td><select class="rs ${r.res}" data-k="res" data-m="${mi}" data-s="${si}" data-r="${ri}">${["OK","NOK","Pending"].map(o=>`<option ${r.res==o?'selected':''}>${o}</option>`).join('')}</select></td>
<td><textarea data-k="note" data-m="${mi}" data-s="${si}" data-r="${ri}" style="min-width:110px">${esc(r.note)}</textarea></td>
<td><button class="mini ${r.paraf?'has':''}" data-a="paraf" data-m="${mi}" data-s="${si}" data-r="${ri}">${r.paraf?'✓ Paraf':'Paraf'}</button></td>
<td><input data-k="tester" data-m="${mi}" data-s="${si}" data-r="${ri}" value="${esc(r.tester)}" style="min-width:80px"></td>
<td><button class="mini ${r.cap?'has':''}" data-a="cap" data-m="${mi}" data-s="${si}" data-r="${ri}">${r.cap?'✓ screenshot.png':'+ Capture'}</button></td>
<td><button class="x" data-a="dr" data-m="${mi}" data-s="${si}" data-r="${ri}" title="Hapus baris">✕</button></td></tr>`).join('')}
</tbody></table></div><div class="add"><button class="b" data-a="ar" data-m="${mi}" data-s="${si}">+ Tambah Skenario</button></div>`).join('')}
<div class="add" style="background:var(--hd)"><button class="b" data-a="as" data-m="${mi}">+ Tambah Sub-bagian</button></div></div>`).join('');
stats()}
function stats(){const a=M.flatMap(m=>m.secs.flatMap(s=>s.rows)),c=k=>a.filter(r=>r.res==k).length,n=a.length||1;
$('stats').innerHTML=[["Total",a.length],["OK",c("OK")],["NOK",c("NOK")],["Pending",c("Pending")],["Pass rate",Math.round(c("OK")/n*100)+"%"]].map(x=>`<div class="st"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');
$('prog').innerHTML=`<i style="width:${c("OK")/n*100}%;background:var(--ok)"></i><i style="width:${c("NOK")/n*100}%;background:var(--ng)"></i>`;
$('chips').innerHTML=["","OK","NOK","Pending"].map(f=>`<button class="chip ${flt==f?'on':''}" data-f="${f}">${f||'Semua'}</button>`).join(' ')}
document.addEventListener('input',e=>{const d=e.target.dataset;if(!d.k)return;const v=e.target.value;
if(d.k=='mn')M[d.m].name=v;else if(d.k=='sn')M[d.m].secs[d.s].name=v;else M[d.m].secs[d.s].rows[d.r][d.k]=v;
if(d.k=='res'||d.k=='type'){render()}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
if(d.f!==undefined){flt=d.f;return render()}
const S=()=>M[d.m].secs[d.s],R=()=>S().rows[d.r];
if(d.a=='paraf'){R().paraf=!R().paraf}else if(d.a=='cap'){R().cap=!R().cap}
else if(d.a=='dr'){S().rows.splice(d.r,1)}
else if(d.a=='ar'){S().rows.push(mk([]))}
else if(d.a=='as'){M[d.m].secs.push({name:"Sub-bagian baru",rows:[mk([])]})}
else if(d.a=='dm'){M.splice(d.m,1)}
else return;render()});
$('addmod').onclick=()=>{M.push({name:"Modul baru",secs:[{name:"Sub-bagian baru",rows:[mk([])]}]});render()};
function toast(m){$('t').textContent=m;$('t').classList.add('on');setTimeout(()=>$('t').classList.remove('on'),1800)}
$('sv').onclick=()=>toast('Draft tersimpan (mockup)');
$('sb').onclick=()=>{const p=M.flatMap(m=>m.secs.flatMap(s=>s.rows)).filter(r=>r.res=='Pending').length;toast(p?'Masih ada '+p+' skenario Pending':'Hasil testing terkirim (mockup)')};
render();
</script></body></html>
