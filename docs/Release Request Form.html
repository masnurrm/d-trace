<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Release Request Form</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1b2333;--mut:#667085;--bd:#dfe3ec;--pri:#1f4fd8;--pri2:#e8eefd;--ok:#12805c;--okbg:#e2f5ee;--no:#8a5a00;--nobg:#fff1d6;--hd:#eef1f7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141d;--card:#181e2a;--tx:#e8ecf5;--mut:#98a2b8;--bd:#2a3244;--pri:#6b93ff;--pri2:#1f2a48;--ok:#4cd3a0;--okbg:#12362b;--no:#f3c15e;--nobg:#3a2f12;--hd:#1e2535}}
:root[data-theme="dark"]{--bg:#10141d;--card:#181e2a;--tx:#e8ecf5;--mut:#98a2b8;--bd:#2a3244;--pri:#6b93ff;--pri2:#1f2a48;--ok:#4cd3a0;--okbg:#12362b;--no:#f3c15e;--nobg:#3a2f12;--hd:#1e2535}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:16px}
h1{font-size:22px;margin:0;letter-spacing:.3px}
.dt{color:var(--mut);font-size:13px}.dt b{color:var(--tx)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:18px}
.card h2{font-size:15px;margin:0 0 2px}
.sub{color:var(--mut);font-size:12.5px;margin-bottom:14px}
.badge{display:inline-block;background:var(--pri2);color:var(--pri);border-radius:6px;padding:1px 8px;font-weight:700;margin-right:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.span2{grid-column:span 2}@media(max-width:560px){.span2{grid-column:auto}}
label{display:block;font-size:12px;font-weight:600;margin-bottom:4px}
label small{color:var(--mut);font-weight:400}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:-1px}
.row{display:flex;gap:8px;align-items:center}.row span{color:var(--mut);font-size:12px;white-space:nowrap}
.bar{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-bottom:14px}
.prog{flex:1;min-width:180px;height:8px;background:var(--hd);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s}
.stat{font-size:12.5px;color:var(--mut)}.stat b{color:var(--tx)}
.tbl{overflow-x:auto;border:1px solid var(--bd);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:900px}
th{background:var(--hd);text-align:left;font-size:12px;padding:8px 10px;white-space:nowrap}
td{padding:6px 10px;border-top:1px solid var(--bd);vertical-align:middle}
tr.grp td{background:var(--pri2);color:var(--pri);font-weight:700;font-size:12.5px}
td.n{color:var(--mut);width:34px}
td input,td select{padding:5px 8px;font-size:13px}
.res{min-width:118px}
.res.done{background:var(--okbg);color:var(--ok);font-weight:600}
.res.no{background:var(--nobg);color:var(--no);font-weight:600}
.ev{background:none;border:1px dashed var(--bd);color:var(--pri);border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer;white-space:nowrap}
.ev.has{border-style:solid;background:var(--pri2)}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
button.b{font:inherit;font-weight:600;border-radius:8px;padding:9px 16px;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
button.p{background:var(--pri);border-color:var(--pri);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
</style></head><body><div class="wrap">
<header><div><h1>Release Request Form</h1><div class="dt">Mockup · Form rilis layanan IT</div></div>
<div class="dt">Document Date &amp; Time: <b id="now"></b></div></header>

<section class="card">
<h2><span class="badge">A</span>General Information</h2>
<div class="sub">Diisi oleh IT Development sebagai Requester</div>
<div class="grid">
<div><label>Service Name</label><input placeholder="mis. Mobile Banking v2"></div>
<div><label>Reference <small>(jika perlu)</small></label><input placeholder="No. referensi / tiket"></div>
<div><label>Release Type</label><select><option>Project</option><option>CR</option><option>ICR</option></select></div>
<div><label>Service Type</label><select><option>Apps</option><option>Infra</option></select></div>
<div><label>Service Version</label><input placeholder="1.0.0"></div>
<div><label>Priority</label><select><option>High</option><option selected>Medium</option><option>Low</option></select></div>
<div><label>Down-Time Duration</label><div class="row"><input type="number" min="0" placeholder="0"><span>Jam</span><input type="number" min="0" max="59" placeholder="0"><span>Menit</span></div></div>
<div class="span2"><label>Requested Deployment</label><div class="row"><input type="datetime-local"><span>s/d</span><input type="datetime-local"></div></div>
<div class="span2"><label>After Go-Live Support</label><div class="row"><input type="date"><span>s/d</span><input type="date"></div></div>
<div class="span2"><label>Impact Description <small>(jika perlu)</small></label><textarea rows="3" placeholder="Jelaskan dampak rilis terhadap layanan/pengguna"></textarea></div>
</div></section>

<section class="card">
<h2><span class="badge">B</span>Release Form</h2>
<div class="sub">Diisi oleh IT Operation sebagai Checker</div>
<div class="bar"><div class="prog"><i id="pb"></i></div>
<div class="stat"><b id="sd">0</b> Done · <b id="sn">0</b> No Need · <b id="sp">29</b> Pending</div>
<button class="b" id="all">Tandai semua Done</button></div>
<div class="tbl"><table><thead><tr><th>No</th><th>Item</th><th>Checklist Result</th><th>Remark</th><th>Checker</th><th>Date</th><th>Evidence</th></tr></thead><tbody id="tb"></tbody></table></div>
</section>

<div class="actions"><button class="b" id="sv">Simpan Draft</button><button class="b p" id="sb">Submit Release Request</button></div>
</div><div class="toast" id="t"></div>
<script>
const G=[["Documentation",["Project Charter","Kick-Off Meeting","Release Request Form","Change Request Form (CRF)","Purchase Order (PO)","User Requirement","Business Process Model (BPM)","Blueprint","Non-Disclosure Agreement (NDA)"]],
["Testing",["Unit/Function Test","System Integration Test (SIT)","User Acceptance Test (UAT)","Secure Programming Test for web based apps and mobile","Security Test"]],
["Socialization & Training",["User Manual","Training for Business User","Working Instruction for IT Operation","Training for IT Operation","Down-Time Information","Up-Time Information","Meeting for Release & Integration Preparation"]],
["Production Environment",["Data Readiness","Production Environment Readiness","Deployment Scenario","Fail-Over Scenario"]],
["Implementation & Deployment",["Request to Publish","Source Code Hand-Over","Support After Go-Live & BAST","Access Sterilization"]]];
const tb=document.getElementById('tb');let n=0;
G.forEach(([g,items])=>{tb.insertAdjacentHTML('beforeend',`<tr class="grp"><td colspan="7">${g}</td></tr>`);
items.forEach(it=>{n++;tb.insertAdjacentHTML('beforeend',`<tr><td class="n">${n}</td><td>${it}</td>
<td><select class="res"><option value="">— Pilih —</option><option value="done">Done</option><option value="no">No Need</option></select></td>
<td><input placeholder="Catatan"></td><td><input placeholder="Nama checker"></td><td><input type="date"></td>
<td><button class="ev" type="button">+ Lampirkan</button></td></tr>`)})});
function upd(){let d=0,x=0;document.querySelectorAll('.res').forEach(s=>{s.className='res'+(s.value?' '+s.value:'');if(s.value=='done')d++;if(s.value=='no')x++});
sd.textContent=d;sn.textContent=x;sp.textContent=29-d-x;pb.style.width=((d+x)/29*100)+'%'}
tb.addEventListener('change',upd);
tb.addEventListener('click',e=>{if(e.target.classList.contains('ev')){const b=e.target,h=b.classList.toggle('has');b.textContent=h?'✓ evidence.pdf':'+ Lampirkan'}});
all.onclick=()=>{document.querySelectorAll('.res').forEach(s=>s.value='done');upd()};
function toast(m){t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}
sv.onclick=()=>toast('Draft tersimpan (mockup)');
sb.onclick=()=>toast(sp.textContent=='0'?'Request terkirim (mockup)':'Masih ada '+sp.textContent+' item pending');
const m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
now.textContent='24/Sep/2026 21:05';upd();
</script></body></html>
